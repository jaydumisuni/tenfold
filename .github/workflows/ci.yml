name: Tenfold CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-verify:
    # G2-00 SS4.1 / G2-03: the Executable Rust Trust Table is the first
    # Rust code in this repository. Uses the toolchain ubuntu-latest
    # already provides (GitHub-maintained, same trust tier as the runner
    # OS itself) rather than pinning a third-party toolchain action; the
    # exact rustc/cargo version is recorded below for transparency, not
    # left implicit.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Record Rust toolchain identity
        run: |
          rustc --version
          cargo --version

      - name: Build Rust workspace
        working-directory: rust
        run: cargo build --workspace --locked

      - name: Run Rust workspace tests
        working-directory: rust
        run: cargo test --workspace --locked

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Tenfold test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,browser]'

      - name: Install pinned Sergeant external assurance authority
        # G2-25 (Bounded Real Gen2 Recovery/Takeover) genuinely invokes
        # the real `sergeant` CLI for external assurance -- not a
        # simulated/self-reported verdict. Same pinned commit TF-24/TF-31
        # already use (git+https://github.com/jaydumisuni/Sergeant.git@4a277cc5950aa08a98157b950c96fb88f2178c79),
        # installed here into the main test venv so the main pytest run
        # can genuinely exercise it, distinct from the separate TF-31
        # repository-only clean-clone venv below.
        run: python -m pip install "git+https://github.com/jaydumisuni/Sergeant.git@4a277cc5950aa08a98157b950c96fb88f2178c79"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run full test suite
        run: python -m pytest -q

      - name: TF-31 repository-only clean-clone qualification
        env:
          TENFOLD_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CLEAN="$RUNNER_TEMP/tenfold-tf31-clean"
          VENV="$RUNNER_TEMP/tenfold-tf31-venv"
          rm -rf "$CLEAN" "$VENV"
          git init "$CLEAN"
          git -C "$CLEAN" fetch --no-tags --depth=1 "$GITHUB_WORKSPACE" "$TENFOLD_CANDIDATE_SHA"
          git -C "$CLEAN" checkout --detach FETCH_HEAD
          test "$(git -C "$CLEAN" rev-parse HEAD)" = "$TENFOLD_CANDIDATE_SHA"
          test -z "$(git -C "$CLEAN" status --porcelain)"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install "$CLEAN[dev,browser]"
          "$VENV/bin/python" -m pip install "git+https://github.com/jaydumisuni/Sergeant.git@4a277cc5950aa08a98157b950c96fb88f2178c79"
          (
            cd "$CLEAN"
            PATH="$VENV/bin:$PATH" TENFOLD_REPOSITORY_ONLY_PROOF=1 "$VENV/bin/python" -m compileall -q src
            PATH="$VENV/bin:$PATH" TENFOLD_REPOSITORY_ONLY_PROOF=1 "$VENV/bin/python" -m pytest -q
          )
