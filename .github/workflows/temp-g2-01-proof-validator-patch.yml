name: TEMP G2-01 proof-validator patch transport

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    if: github.head_ref == 'temp/g2-01-proof-validator-patch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: temp/g2-01-proof-validator-patch
          fetch-depth: 0
          persist-credentials: true

      - name: Set up transport Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install transport-only test runner
        run: python -m pip install --no-deps pytest==9.1.1 pluggy==1.6.0 iniconfig==2.3.0 packaging==26.3 Pygments==2.21.0

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/g2-01-proof-validator.patch
          git apply .github/g2-01-proof-validator.patch
          rm .github/g2-01-proof-validator.patch
          rm .github/workflows/temp-g2-01-proof-validator-patch.yml
          python -m compileall -q src
          PYTHONPATH=src python -m pytest -q tests/gen2/test_g2_01_reference.py tests/gen2/test_g2_01_proof_validation.py

      - name: Publish patched transport tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add -A
          git commit -m 'temp: materialize reviewed G2-01 proof validator patch'
          git push origin HEAD:temp/g2-01-proof-validator-patch
