name: Workspace Neo Phase 21 status mirror

on:
  pull_request:
    branches: [main]
    paths:
      - "workspace/neo_phase21_status_campaign.py"
      - ".github/workflows/workspace-neo-phase21-status.yml"

permissions:
  contents: read

jobs:
  neo-phase21-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEO_MAIN: 28fcefe63f11f3bf215ef21f17210be38f0ef780
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Check out exact Tenfold workspace head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact Tenfold workspace head
        shell: bash
        env:
          TENFOLD_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$TENFOLD_HEAD"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Bind qualified Tenfold source runtime without modifying checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tenfold
          from tenfold.foreman import Foreman
          from tenfold.workforce import LocalWorkforce
          print(tenfold.__file__)
          print(Foreman.__name__)
          print(LocalWorkforce.__name__)
          PY
          test -z "$(git status --porcelain)"

      - name: Check out exact Neo authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jaydumisuni/Neo-Driver
          ref: ${{ env.NEO_MAIN }}
          path: .workspace-authority/neo
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact Neo authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .workspace-authority/neo rev-parse HEAD)" = "$NEO_MAIN"
          test -z "$(git -C .workspace-authority/neo status --porcelain)"

      - name: Execute real Tenfold Neo status campaign
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/neo-phase21-status-tenfold.json"
          python workspace/neo_phase21_status_campaign.py \
            --authority-root "$GITHUB_WORKSPACE/.workspace-authority/neo" \
            --output "$OUT" | tee "$RUNNER_TEMP/neo-phase21-status-tenfold.log"
          grep -q 'TENFOLD_NEO_PHASE21_STATUS_PREFLIGHT_OK' "$RUNNER_TEMP/neo-phase21-status-tenfold.log"
          python - "$OUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['tenfold_base'] == '51a220f6554674aa8bfeb1f5f56c9a09fef4de76'
          assert data['neo']['main'] == '28fcefe63f11f3bf215ef21f17210be38f0ef780'
          assert data['derivation_passed'] is True
          assert data['semantic_failures'] == []
          assert data['deterministic_worker_evidence'] == 2
          assert data['deterministic_worker_failures'] == 0
          assert data['authority_council']['accepted_for_rebrief'] is True
          assert data['frontier']['ready'] == ['STATUS_MIRROR_SYNC']
          assert data['frontier']['blocked'] == []
          assert data['frontier']['prepare_only'] == []
          assert data['allowed_mutation'] == 'docs/IMPLEMENTATION_STATUS.md'
          assert data['next_gate'] == 'STATUS_MIRROR_SYNC'
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Prove Neo authority remained clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .workspace-authority/neo rev-parse HEAD)" = "$NEO_MAIN"
          test -z "$(git -C .workspace-authority/neo status --porcelain)"

      - name: Remove external authority materialization
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/.workspace-authority"

      - name: Prove Tenfold workspace remained clean
        shell: bash
        env:
          TENFOLD_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TENFOLD_HEAD"
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
