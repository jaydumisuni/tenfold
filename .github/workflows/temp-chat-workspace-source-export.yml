name: TEMP Chat workspace Tenfold source export

on:
  push:
    branches:
      - temp/chat-workspace-tenfold-export-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Disposable transport workflow. DO NOT MERGE.
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact transport candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact current Tenfold source
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=fd3645cc49126d730c697c4701e3be42eb073d42
          test "$(git rev-parse "$BASE_SHA")" = "$BASE_SHA"
          git archive --format=tar.gz --output=tenfold-main-fd3645cc.tar.gz "$BASE_SHA"
          sha256sum tenfold-main-fd3645cc.tar.gz | tee tenfold-main-fd3645cc.tar.gz.sha256
          printf '%s\n' "$BASE_SHA" > tenfold-main-fd3645cc.commit
      - name: Upload exact source transport artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tenfold-main-fd3645cc-source
          path: |
            tenfold-main-fd3645cc.tar.gz
            tenfold-main-fd3645cc.tar.gz.sha256
            tenfold-main-fd3645cc.commit
          if-no-files-found: error
          retention-days: 1
