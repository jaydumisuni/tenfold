[package]
name = "tenfold-runtime-obligation"
version = "0.1.0"
edition = "2021"
description = "Runtime Obligation independent derivation (G2-00 SS8.7, G2-13) for Tenfold Gen 2.0."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trust_table = { package = "tenfold-trust-table", path = "../trust_table" }

[lib]
name = "runtime_obligation"
path = "src/lib.rs"

[[bin]]
name = "runtime_obligation_cli"
path = "src/bin/runtime_obligation_cli.rs"
