[package]
name = "tenfold-dispatch-lease"
version = "0.1.0"
edition = "2021"
description = "Dispatch / Lease / Fencing Kernel (G2-00 SS14-15, G2-11) for Tenfold Gen 2.0."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trust_table = { package = "tenfold-trust-table", path = "../trust_table" }
identity_generation = { package = "tenfold-identity-generation", path = "../identity_generation" }

[lib]
name = "dispatch_lease"
path = "src/lib.rs"

[[bin]]
name = "dispatch_lease_cli"
path = "src/bin/dispatch_lease_cli.rs"
