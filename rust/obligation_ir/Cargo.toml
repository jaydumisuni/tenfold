[package]
name = "tenfold-obligation-ir"
version = "0.1.0"
edition = "2021"
description = "Canonical Obligation IR decoder/encoder (G2-00 SS7, SS7.1) for Tenfold Gen 2.0."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "obligation_ir"
path = "src/lib.rs"
