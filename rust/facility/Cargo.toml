[package]
name = "tenfold-facility"
version = "0.1.0"
edition = "2021"
description = "Facility Capability ABI, read-only/sandbox gate (G2-00 SS9.1, G2-14) for Tenfold Gen 2.0."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trust_table = { package = "tenfold-trust-table", path = "../trust_table" }

[lib]
name = "facility"
path = "src/lib.rs"

[[bin]]
name = "facility_cli"
path = "src/bin/facility_cli.rs"
