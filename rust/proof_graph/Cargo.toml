[package]
name = "tenfold-proof-graph"
version = "0.1.0"
edition = "2021"
description = "Proof Graph / Assurance / Falsification Runtime (G2-00 SS11, G2-12) for Tenfold Gen 2.0."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
obligation_ir = { package = "tenfold-obligation-ir", path = "../obligation_ir" }
trust_table = { package = "tenfold-trust-table", path = "../trust_table" }

[lib]
name = "proof_graph"
path = "src/lib.rs"

[[bin]]
name = "proof_graph_cli"
path = "src/bin/proof_graph_cli.rs"
