[package]
name = "tenfold-chronicle"
version = "0.1.0"
edition = "2021"
description = "Local Authoritative Chronicle Candidate (G2-00 SS8, G2-10) for Tenfold Gen 2.0."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
trust_table = { package = "tenfold-trust-table", path = "../trust_table" }

[lib]
name = "chronicle"
path = "src/lib.rs"

[[bin]]
name = "chronicle_cli"
path = "src/bin/chronicle_cli.rs"
