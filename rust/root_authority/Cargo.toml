[package]
name = "tenfold-root-authority"
version = "0.1.0"
edition = "2021"
description = "Root / Issuing Authority Planes, MINTABLE_SCOPE_BOUND* and reverse causal preimage (G2-00 SS10, G2-17) for Tenfold Gen 2.0."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trust_table = { package = "tenfold-trust-table", path = "../trust_table" }
capability_graph = { package = "tenfold-capability-graph", path = "../capability_graph" }

[lib]
name = "root_authority"
path = "src/lib.rs"

[[bin]]
name = "root_authority_cli"
path = "src/bin/root_authority_cli.rs"
